# ============================================================
# ops 部署工具配置文件
# 所有服务的公共参数、镜像版本、端口都在这里集中管理
# 修改后无需改脚本，直接生效
# ============================================================

# ---------- 全局公共配置 ----------
NETWORK="gogu-net"                       # docker 网络
RESTART_POLICY="unless-stopped"          # 重启策略

ETCD="etcd:2379"
NATS_URL="nats://nats:4222"
PLATFORM_GRPC_ADDR="platform-1:7000"

MONGO_URL="mongodb://172.17.0.1:27018"
MONGO_USER="admin"
MONGO_PASS="asd620522-"
GCONF_DB_URI="mongodb://admin:asd620522-@172.17.0.1:27018/?authSource=admin"
GCONF_DB="gs_conf_g1_dev"

# ---------- 镜像版本 ----------
# 部署时用到的镜像 tag，升级/回滚时改这里，或用命令行覆盖
IMG_PLATFORM="gogs-platform:v1001-2"
IMG_GATE="gogs-gate:v1001-2"
IMG_GAME="gogs-game:v1001-3"
IMG_BATTLE="gogs-battle:v1001-4"

# ---------- 服务清单 ----------
# start all / status 等操作会按此顺序处理（platform 优先，作为其他服务的依赖）
SERVICES="platform gate game battle"
